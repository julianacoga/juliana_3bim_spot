<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Pacote de Viagem</title>
    <link rel="stylesheet" href="pacote.css">
</head>

<body onload="inicializar()">
    <header>
        <h1>Cadastro de pacotes de viagens</h1>
        <p>Gerencie o estoque de pacotes do sistema.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do pacote</h2>
                
                <label for="inputId_pacote">ID do pacote</label>
                <div class="linha-id">
                    <input type="text" name="inputId_pacote" id="inputId_pacote" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>                

                <label for="inputDestino_pacote">Destino</label>
                <input type="text" name="inputDestino_pacote" id="inputDestino_pacote">

                <label for="inputDescricao_pacote">Descricao</label>
                <input type="text" name="inputDescricao_pacote" id="inputDescricao_pacote">
                
                <label for="selectId_categoria">Categoria</label>
                <select name="selectId_categoria" id="selectId_categoria" disabled>
                    <option value="">Carregando...</option>
                </select>

                <label for="inputPreco_pacote">Preço</label>
                <input type="number" name="inputPreco_pacote" id="inputPreco_pacote">

                <label for="inputQuantidade_estoque_pacote">Quantidade disponivel</label>
                <input type="number" name="inputQuantidade_estoque_pacote" id="inputQuantidade_estoque_pacote">

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

            <aside class="form-direita">
                <h2>Imagem do pacote</h2>
                <p class="instrucao-imagem">(Clique na imagem para alterar)</p>
                <div class="img-container">
                    <img id="imgpacote" src="http://localhost:3001/imagens/silhueta.png" alt="Imagem do pacote" onclick="acionarUpload()">
                    <input type="file" id="inputImagem" accept="image/*" style="display: none;" onchange="previewImagem()">
                </div>
            </aside>
        </div>

        <section class="lista-pacote">
            <h3>Pacotes Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD pacotes. Todos os direitos reservados. <br> Juliana Coga - M32 2026</p>
    </footer>

    <script src="./pacote.js"></script>
</body>

</html>
